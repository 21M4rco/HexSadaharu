name: Build and verify Sadaharu
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check asset and behavior contracts
        run: python3 tools/verify.py
      - name: Compile and package
        run: timeout -k 30 900 bash gradlew build sourceZip --stacktrace
      - name: Confirm one ready-to-install jar
        run: |
          ls -l build/libs
          test "$(ls -1 build/libs/*.jar 2>/dev/null | wc -l)" -eq 1
          jar=$(ls -1 build/libs/*.jar)
          for entry in META-INF/mods.toml pack.mcmeta \
                       com/hex/sadaharu/Sadaharu.class \
                       com/hex/sadaharu/client/SadaharuModel.class \
                       assets/hexsadaharu/sounds.json \
                       assets/hexsadaharu/sounds/bark.ogg \
                       assets/hexsadaharu/models/entity/sadaharu.json \
                       assets/hexsadaharu/textures/entity/sadaharu.png; do
            unzip -l "$jar" | grep -q " $entry$" || { echo "::error::$jar is missing $entry"; exit 1; }
          done
          echo "$jar is installable as-is"
      - name: Download Minecraft assets with one network retry
        run: bash gradlew downloadAssets || bash gradlew downloadAssets
      - name: Server integration tests
        # Bounded like the render step: a stalled server must fail, not idle out the job.
        run: timeout -k 30 600 bash gradlew runGameTestServer --stacktrace
      - name: Native client model render
        # Hard bound: a wedged GL context must fail the step, never consume the job timeout.
        run: xvfb-run -a timeout -k 30 540 bash gradlew runClient -PvisualReview --stacktrace
        env:
          LIBGL_ALWAYS_SOFTWARE: "true"
          GALLIUM_DRIVER: llvmpipe
          MESA_GL_VERSION_OVERRIDE: "4.6"
          MESA_GLSL_VERSION_OVERRIDE: "460"
      - name: Upload the mod jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HexSadaharu-Forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HexSadaharu-diagnostics
          path: |
            build/distributions/*.zip
            run-gametest/logs/latest.log
            run/screenshots/*.png
            run/logs/latest.log
          if-no-files-found: ignore
