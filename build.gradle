plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
group = 'com.hex.sadaharu'
version = '1.0.0'
base { archivesName = 'hexsadaharu' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    mappings channel: 'official', version: '1.20.1'
    runs {
        client { property 'hexsadaharu.review', project.hasProperty('visualReview') ? 'true' : 'false'; args '--width', '1500', '--height', '1000'; workingDirectory project.file('run'); mods { hexsadaharu { source sourceSets.main } } }
        server { workingDirectory project.file('run'); args '--nogui'; mods { hexsadaharu { source sourceSets.main } } }
        gameTestServer {
            workingDirectory project.file('run-gametest')
            property 'forge.enabledGameTestNamespaces', 'hexsadaharu'
            mods { hexsadaharu { source sourceSets.main } }
        }
    }
}
repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.3.22' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar.finalizedBy('reobfJar')
tasks.register('sourceZip', Zip) {
    archiveClassifier = 'sources'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(projectDir) { exclude '.git/**', '.gradle/**', 'build/**', 'run*/**', '*.zip', '__pycache__/**' }
}
